<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigBrain — Morphable UI</title>
  <link rel="stylesheet" href="/static/style.css">

  <!-- Geist font (same as Scratchy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
</head>
<body data-focus-mode="normal">
  <div id="app">

    <!-- Top Bar: logo + workspace selector + connection -->
    <div id="top-bar">
      <div class="logo">
        <span>🧠</span>
        <span>BigBrain</span>
      </div>
      <div id="workspace-selector">
        <!-- Populated by app.js -->
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: var(--text-muted);">Bus</span>
        <div id="connection-status" class="connection-disconnected"></div>
      </div>
    </div>

    <!-- Grid Container: panels live here, managed by SlotManager -->
    <div id="grid-container">
      <!-- Panels are dynamically created by app.js -->
    </div>

    <!-- Status Strip: persistent ambient info -->
    <div id="status-strip">
      <!-- Populated by StatusStripPanel -->
    </div>

    <!-- Chat Input -->
    <div id="input-area">
      <input
        type="text"
        id="chat-input"
        placeholder="Talk to BigBrain... (Enter to send)"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

  </div>

  <!-- App Entry Point -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
