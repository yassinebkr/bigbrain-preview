<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigBrain — Morphable UI</title>
  <link rel="stylesheet" href="/static/style.css">

  <!-- Geist font (same as Scratchy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
</head>
<body data-focus-mode="normal">
  <div id="app">

    <!-- Top Bar -->
    <div id="top-bar">
      <div class="logo">
        <span>🧠</span>
        <span>BigBrain</span>
      </div>
      <div id="workspace-selector">
        <!-- Populated by app.js -->
      </div>
      <div class="connection-wrap">
        <span class="connection-label">Bus</span>
        <div id="connection-status" class="connection-disconnected"></div>
      </div>
    </div>

    <!-- Panel grid -->
    <div id="grid-container"></div>

    <!-- Status strip -->
    <div id="status-strip"></div>

    <!-- Chat input -->
    <div id="input-area">
      <input type="text" id="chat-input" placeholder="Ask BigBrain anything..." autocomplete="off" spellcheck="false">
      <button id="send-btn">Send ⏎</button>
    </div>

  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
