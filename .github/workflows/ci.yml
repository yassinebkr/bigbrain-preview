name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # This baseline supports the user namespaces required by both sandbox paths.
    # Newer Ubuntu images need explicit AppArmor profiles before migration.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline comparison tests load the frozen pre-change implementation.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pinned Bubblewrap 0.12.0
        uses: actions/checkout@v4
        with:
          repository: containers/bubblewrap
          ref: 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          path: .ci-bubblewrap
          persist-credentials: false
      - name: Build descriptor-aware isolation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev ninja-build pkg-config
          python -m pip install meson
          meson setup .ci-bubblewrap/build .ci-bubblewrap --prefix=/usr/local -Dman=disabled -Dtests=false
          ninja -C .ci-bubblewrap/build
          sudo ninja -C .ci-bubblewrap/build install
      - name: Install core + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,web,memory,research]"
          python -m playwright install --with-deps chromium
      - name: Install React integration fixtures
        run: npm ci --prefix web-ui
      - name: Verify execution and browser isolation
        run: |
          bwrap --help | grep -- --ro-bind-fd
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def check():
              async with async_playwright() as driver:
                  browser = await driver.chromium.launch(chromium_sandbox=True)
                  await browser.close()

          asyncio.run(check())
          PY
      - name: Lint (ruff, non-blocking on docs)
        run: |
          pip install ruff
          ruff check bigbrain/ tests/ || true
      - name: Tests
        # The two deselected tests are pre-existing environment-fragile
        # cases: a raw asyncio.get_event_loop() call after an async test
        # (Python 3.13) and a wall-clock parallelism assertion.
        run: |
          pytest tests/ --ignore=tests/test_voice_real.py -q \
            --deselect tests/test_architect.py::TestArtifactFlow::test_upstream_context_keyed_by_filepath \
            --deselect tests/test_integration_dispatch.py::TestParallelExecution::test_pool_dispatches_to_multiple_workers

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Unit tests (store state machine)
        run: npm run test
      - name: Type-check + build
        run: npm run build
