[project]
name = "bigbrain-preview"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "textual>=0.40",
    # LLM layer: litellm for legacy provider keys; httpx for the registry
    # providers (OpenRouter/Mistral/Kimi) and the auth wizards.
    "litellm>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
description = "BigBrain - A Multi-Brain AI Agent System (Preview Implementation)"
authors = [
    {name = "BigBrain Team"}
]
readme = "README.md"

[project.optional-dependencies]
voice = [
    "websockets>=12.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    # STT/TTS: deepgram-sdk>=3.0, cartesia>=1.0 (need DEEPGRAM/CARTESIA keys)
]
web = [
    "aiohttp>=3.9",
]
memory = [
    "chromadb>=0.4",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
